<!DOCTYPE html>
<html lang="ja">
<head>

<meta property="og:site_name" content="MyShelf">

<meta property="og:description" content="読んだ本・観た映画や美術館の感想を自分の端末内だけに残せるノート">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Shippori+Mincho+B1:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#fdfcf8; --ink:#1b1916; --sub:#8b857a; --line:#e3ded3;
  --gold:#a8894e; --gold-soft:#c9b285; --danger:#8e3b2e;
  --serif:"Cormorant Garamond","Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --jp-serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Jost","Hiragino Sans","Noto Sans JP",sans-serif;
  --shadow:0 1px 2px rgba(27,25,22,.05),0 10px 30px rgba(27,25,22,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:110px;-webkit-font-smoothing:antialiased;font-weight:400}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ===== header ===== */
header{position:sticky;top:0;z-index:10;background:rgba(244,241,234,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:20px 20px 14px;text-align:center}
.brand{display:inline-block;cursor:pointer;user-select:none;transition:opacity .2s}
.brand:hover{opacity:.72}
.brand:focus-visible{outline:1px solid var(--gold-soft);outline-offset:6px}
.logo{font-family:var(--serif);font-size:1.9rem;font-weight:600;letter-spacing:.06em;line-height:1;color:var(--ink)}
.logo em{font-style:italic;color:var(--gold)}
.tagline{font-size:.55rem;letter-spacing:.5em;color:var(--sub);text-transform:uppercase;margin-top:7px;text-indent:.5em}
.tagline::before,.tagline::after{content:"—";color:var(--gold-soft);margin:0 10px;letter-spacing:0}
.iconbtn{position:absolute;right:16px;top:26px;background:none;border:none;font-size:1.2rem;cursor:pointer;padding:6px;color:var(--sub);transition:color .2s}
.iconbtn:hover{color:var(--gold)}
main{max-width:680px;margin:0 auto;padding:22px 18px 20px}
/* ===== tabs ===== */
.tabs{display:flex;gap:26px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none;justify-content:center;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:none;background:none;padding:8px 2px 12px;font-size:.78rem;cursor:pointer;white-space:nowrap;color:var(--sub);letter-spacing:.18em;font-family:var(--sans);border-bottom:1px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab.on{color:var(--ink);border-color:var(--gold);font-weight:500}
.toolbar{display:flex;gap:10px;margin-bottom:22px}
.toolbar input{flex:1;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px;font-size:.9rem;background:transparent;font-family:var(--sans);letter-spacing:.04em}
.toolbar input:focus,form input:focus,form textarea:focus{outline:none;border-color:var(--gold)}
.toolbar select{border:none;border-bottom:1px solid var(--line);padding:9px 2px;font-size:.8rem;background:transparent;color:var(--sub);letter-spacing:.06em}
/* ===== cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:16px;align-items:flex-start;transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .4s ease both}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(27,25,22,.12);border-color:var(--gold-soft)}
.cover{width:54px;height:78px;object-fit:cover;border-radius:2px;box-shadow:3px 4px 12px rgba(27,25,22,.22);flex-shrink:0;background:#eae6dd}
.emoji-tile{width:54px;height:78px;border-radius:2px;background:#edeade;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;border:1px solid var(--line)}
.card h3{font-family:var(--jp-serif);font-size:1.04rem;font-weight:600;margin-bottom:3px;letter-spacing:.02em;line-height:1.5}
.card .meta{font-size:.72rem;color:var(--sub);letter-spacing:.08em}
.card .memo-preview{font-size:.8rem;color:var(--sub);margin-top:7px;line-height:1.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stars{color:var(--gold);font-size:.78rem;letter-spacing:.14em;margin-top:3px}
.tagchip{display:inline-block;border:1px solid var(--line);border-radius:2px;padding:2px 9px;font-size:.65rem;color:var(--sub);margin:7px 5px 0 0;letter-spacing:.1em}
.empty{text-align:center;color:var(--sub);padding:80px 20px;font-size:.88rem;line-height:2.4;font-family:var(--jp-serif)}
.empty::before{content:"❦";display:block;color:var(--gold-soft);font-size:1.3rem;margin-bottom:14px}
/* ===== fab ===== */
.fab{position:fixed;right:22px;bottom:28px;width:58px;height:58px;border-radius:50%;background:var(--ink);color:#f4f1ea;font-size:1.55rem;font-weight:300;border:none;outline:1px solid var(--gold);outline-offset:3px;box-shadow:0 8px 24px rgba(27,25,22,.35);cursor:pointer;z-index:20;transition:transform .2s}
.fab:hover{transform:scale(1.07)}
/* ===== form ===== */
form label{display:block;font-size:.62rem;color:var(--gold);margin:20px 0 7px;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
form input[type=text],form input[type=date],form textarea,form select,form input[type=password]{width:100%;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px;font-size:.96rem;background:transparent;font-family:var(--sans);letter-spacing:.02em}
form textarea{min-height:110px;resize:vertical;line-height:1.9;border:1px solid var(--line);padding:12px;background:var(--card);border-radius:3px}
.typesel{display:flex;gap:10px}
.typesel button{flex:1;border:1px solid var(--line);background:transparent;border-radius:2px;padding:13px 4px;font-size:.82rem;cursor:pointer;color:var(--sub);transition:all .2s;letter-spacing:.14em}
.typesel button.on{border-color:var(--ink);color:var(--ink);font-weight:500;background:var(--card)}
.typesel button .ti{display:block;margin:0 auto 5px;color:var(--gold);line-height:0}
.typesel button.on .ti{color:var(--ink)}
.tab svg{vertical-align:-2px;margin-right:3px;opacity:.75}
.emoji-tile{color:var(--gold)}
.dhead .tico{display:inline-block;vertical-align:-3px;margin-right:5px;color:var(--gold)}
.starinput{font-size:1.7rem;cursor:pointer;color:#ddd8ca;user-select:none;letter-spacing:.12em}
.starinput .lit{color:var(--gold)}
.btnrow{display:flex;gap:12px;margin-top:26px}
.btn{flex:1;border:none;border-radius:2px;padding:14px;font-size:.85rem;cursor:pointer;font-weight:500;font-family:var(--sans);letter-spacing:.16em;transition:all .2s}
.btn.primary{background:var(--ink);color:#f4f1ea}
.btn.primary:hover{background:#33302a}
.btn.accent{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.btn.accent:hover{background:var(--gold);color:#f4f1ea}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
.btn.ghost:hover{border-color:var(--sub)}
.btn.danger{background:transparent;border:1px solid #d8c7c2;color:var(--danger)}
.btn.small{flex:none;padding:10px 16px;font-size:.74rem}
/* cover preview in form */
.coverprev{display:flex;align-items:center;gap:14px;margin-top:10px}
.coverprev img{width:66px;height:94px;object-fit:cover;border-radius:2px;box-shadow:3px 4px 12px rgba(27,25,22,.25)}
.coverprev .rm{font-size:.7rem;color:var(--sub);cursor:pointer;text-decoration:underline;letter-spacing:.08em}
/* ===== autocomplete ===== */
.acwrap{position:relative}
.aclist{position:absolute;left:0;right:0;top:calc(100% + 2px);background:var(--card);border:1px solid var(--line);border-top:2px solid var(--gold);box-shadow:0 16px 40px rgba(27,25,22,.16);z-index:30;max-height:300px;overflow-y:auto}
.acitem{padding:11px 14px;font-size:.86rem;cursor:pointer;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.acitem:last-child{border-bottom:none}
.acitem:hover{background:#f2efe7}
.acitem img{width:30px;height:42px;object-fit:cover;border-radius:1px;flex-shrink:0;box-shadow:1px 2px 5px rgba(0,0,0,.2)}
.acitem .src{font-size:.56rem;color:var(--gold);border:1px solid var(--gold-soft);padding:1px 5px;letter-spacing:.1em;flex-shrink:0;border-radius:1px}
.acitem .sub{color:var(--sub);font-size:.74rem}
/* ===== detail ===== */
.dhead{display:flex;gap:20px;align-items:flex-start;margin-bottom:6px}
.dhead .meta{color:var(--gold);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;margin-bottom:6px}
.dhead h2{font-family:var(--jp-serif);font-size:1.45rem;font-weight:600;margin:0 0 5px;line-height:1.5}
.dhead .creator{color:var(--sub);font-size:.86rem;letter-spacing:.04em}
.dcover{width:96px;height:136px;object-fit:cover;border-radius:2px;box-shadow:5px 6px 18px rgba(27,25,22,.28);flex-shrink:0}
.dtabs{display:flex;border-bottom:1px solid var(--line);margin:20px 0 18px}
.dtab{flex:1;text-align:center;padding:11px 2px;font-size:.72rem;color:var(--sub);cursor:pointer;border-bottom:1px solid transparent;margin-bottom:-1px;letter-spacing:.16em;transition:all .2s}
.dtab.on{color:var(--ink);border-color:var(--gold);font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px;animation:rise .4s ease both}
.panel h4{font-size:.6rem;color:var(--gold);margin-bottom:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:500}
.memo-body{white-space:pre-wrap;font-size:.94rem;line-height:2.1}
.quote{border-left:1px solid var(--gold);padding:6px 16px;margin:10px 0 18px;color:#5d574a;font-size:.9rem;white-space:pre-wrap;font-family:var(--jp-serif);line-height:2}
.linklist a{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.88rem;letter-spacing:.03em;transition:color .15s}
.linklist a:last-child{border-bottom:none}
.linklist a::after{content:"→";color:var(--gold-soft);font-size:.85rem}
.linklist a:hover{color:var(--gold)}
.note{font-size:.72rem;color:var(--sub);line-height:1.9;margin-top:12px;letter-spacing:.02em}
.wikiimg{width:100%;max-height:250px;object-fit:cover;border-radius:3px;margin-bottom:16px}
.spin{text-align:center;color:var(--sub);padding:30px;font-size:.8rem;letter-spacing:.1em}
/* ===== products ===== */
.prodscroll{max-height:480px;overflow-y:auto;border:1px solid var(--line);border-radius:3px}
.prod{display:flex;gap:14px;padding:13px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);align-items:center;transition:background .15s}
.prod:hover{background:#f2efe7}
.prod:last-child{border-bottom:none}
.prod img{width:52px;height:74px;object-fit:contain;flex-shrink:0;background:#efece4;border-radius:2px}
.prod .pt{font-size:.82rem;font-weight:400;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .pa{font-size:.7rem;color:var(--sub);margin-top:2px;letter-spacing:.04em}
.prod .pp{font-size:.84rem;color:var(--ink);font-weight:500;margin-top:4px;letter-spacing:.05em}
.prod .pr{font-size:.68rem;color:var(--gold);font-weight:400;margin-left:8px}
.xadd{display:block}
.xadd textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:9px 10px;font-size:.8rem;background:var(--card);font-family:var(--sans);resize:vertical;line-height:1.6;min-height:0;height:38px;white-space:nowrap;overflow-x:auto}
.xadd textarea:focus{outline:none;border-color:var(--gold)}
.xpost{position:relative;margin-bottom:10px}
.xpost .xdel{position:absolute;right:-6px;top:-6px;z-index:2;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;font-size:.85rem;line-height:1}
.xpost .xdel:hover{color:var(--danger);border-color:var(--danger)}
.xpost blockquote{margin:0}
.note-embed{border:1px solid var(--line);border-radius:3px;display:block;width:100%;max-width:100%;background:var(--card)}
.revsum{display:flex;align-items:center;gap:16px;border:1px solid var(--gold-soft);border-radius:3px;padding:16px;margin-bottom:16px;background:linear-gradient(135deg,#fdfcf8,#f7f3e9)}
.revsum .big{font-family:var(--serif);font-size:1.9rem;font-weight:600;color:var(--gold)}
.revsum .cnt{font-size:.76rem;color:var(--sub);line-height:1.8;letter-spacing:.04em}
/* ===== modal ===== */
.modalbg{position:fixed;inset:0;background:rgba(27,25,22,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);border-top:2px solid var(--gold);width:100%;max-width:680px;max-height:88vh;overflow-y:auto;padding:24px 22px 34px}
.modal h3{font-family:var(--jp-serif);font-size:1.05rem;margin-bottom:16px;letter-spacing:.06em}
.modal textarea{width:100%;min-height:190px;border:1px solid var(--line);border-radius:3px;padding:14px;font-size:.9rem;font-family:var(--sans);background:var(--card);line-height:1.9}
.chiprow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:2px;padding:9px 16px;font-size:.78rem;cursor:pointer;color:var(--sub);letter-spacing:.1em;transition:all .2s}
.chip.on{border-color:var(--gold);color:var(--gold);font-weight:500}
.xcount{font-size:.72rem;color:var(--sub);text-align:right;margin-top:6px;letter-spacing:.04em}
.xcount.near{color:var(--gold)}
.xcount.over{color:var(--danger)}
.viewing .fab,.viewing .iconbtn{display:none}
.pubhead{text-align:center;margin:6px 0 22px}
.pubname{font-family:var(--jp-serif);font-size:1.25rem;font-weight:600;letter-spacing:.04em}
.pubsub{font-size:.68rem;color:var(--sub);letter-spacing:.2em;margin-top:8px}
.pubcard .dhead h2{font-size:1.28rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:108px;background:var(--ink);color:#f4f1ea;padding:12px 26px;border-radius:2px;font-size:.8rem;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;letter-spacing:.1em;border-bottom:2px solid var(--gold)}
.toast.show{opacity:1}
.backlink{color:var(--sub);font-size:.72rem;cursor:pointer;background:none;border:none;padding:4px 0;margin-bottom:10px;letter-spacing:.2em;font-family:var(--sans);text-transform:uppercase}
.backlink:hover{color:var(--gold)}
hr.sep{border:none;border-top:1px solid var(--line);margin:20px 0}
</style>
</head>
<body>
<header>
  <div class="brand" role="button" tabindex="0" onclick="goTop()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goTop()}" aria-label="トップへ戻る">
    <div class="logo">My<em>Shelf</em></div>
    <div class="tagline">Books · Films · Museums</div>
  </div>
  <button class="iconbtn" onclick="go('settings')" aria-label="設定">⚙︎</button>
</header>
<main id="view"></main>
<button class="fab" onclick="go('form')" aria-label="追加">＋</button>
<div id="modalroot"></div>
<div id="toast" class="toast"></div>
<script>
/* ============ state ============ */
const TYPES={book:{label:'本',emoji:'📖',hash:'#読書記録'},movie:{label:'映画',emoji:'🎬',hash:'#映画鑑賞'},museum:{label:'美術館',emoji:'🖼️',hash:'#美術館巡り'}};
/* 上品な線画アイコン（絵文字の代わり） */
const ICONS={
  book:'<path d="M3 5.2c2.6-1 5.4-1 8 0v13.6c-2.6-1-5.4-1-8 0V5.2Z"/><path d="M11 5.2c2.6-1 5.4-1 8 0v13.6c-2.6-1-5.4-1-8 0"/><path d="M11 5.2v13.6"/>',
  movie:'<rect x="2.8" y="5.4" width="16.4" height="13.2" rx="1.4"/><path d="M2.8 9.4h16.4M2.8 14.6h16.4"/><path d="M7 5.4v4M7 14.6v4M15 5.4v4M15 14.6v4"/>',
  museum:'<path d="M2.6 8.6 11 3.6l8.4 5"/><path d="M4.6 8.8v9.4M9 8.8v9.4M13 8.8v9.4M17.4 8.8v9.4"/><path d="M2.6 18.4h16.8"/>'
};
function icon(t,size){return `<svg viewBox="0 0 22 22" width="${size||20}" height="${size||20}" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[t]}</svg>`}
/* 運営側の公開設定（中継所 /api/config から取得） */
let siteCfg={amazonTag:'',ai:false};
/* 中継所（バックエンド）のURL。到達できない場合は同一オリジンの /api にフォールバック */
let API_BASE='https://myshelf-backend.vercel.app';
let mem={};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]||d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
let items=lsGet('kansou_items',[]);
let settings=lsGet('kansou_settings',{});
function saveItems(){lsSet('kansou_items',items)}
function saveSettings(){lsSet('kansou_settings',settings)}
let ui={filter:'all',q:'',sort:'new',dtab:'memo'};
/* ============ utils ============ */
const $=s=>document.querySelector(s);
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function enc(s){return encodeURIComponent(s||'')}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtDate(d){return d?d.replaceAll('-','/'):''}
/* ============ rakuten（中継所 /api/rakuten 経由・アフィリエイトIDはサーバー側で付与） ============ */
let rkState='unknown'; // unknown | ok | unconfigured
function rkKey(){return rkState!=='unconfigured'}
function rkUrl(type,q,hits){
  const p=new URLSearchParams({src:type,hits:String(hits)});
  if(type==='museum')p.set('keyword',q+' 図録');else p.set('title',q);
  return API_BASE+'/api/rakuten?'+p.toString();
}
async function rkFetch(type,q,hits){
  const r=await fetch(rkUrl(type,q,hits));
  const d=await r.json().catch(()=>({}));
  if(r.status===503||d.error==='not_configured'){rkState='unconfigured';throw new Error('not_configured')}
  if(!r.ok||d.error)throw new Error(d.error||('http '+r.status));
  rkState='ok';return d;
}
function bigImg(u){return (u||'').replace(/\?_ex=\d+x\d+/,'?_ex=400x400')}
function rkNorm(type,i){
  if(type==='museum')return {title:i.itemName,author:i.shopName,price:i.itemPrice,img:(i.mediumImageUrls||[])[0]||'',url:i.affiliateUrl||i.itemUrl,rev:i.reviewAverage,revc:i.reviewCount};
  return {title:i.title,author:i.author||i.artistName||'',price:i.itemPrice,img:i.largeImageUrl||i.mediumImageUrl||'',url:i.affiliateUrl||i.itemUrl,rev:i.reviewAverage,revc:i.reviewCount};
}
/* ============ router ============ */
function goTop(){ui.filter='all';ui.q='';ui.sort='new';closeModal();go('list')}
function go(view,id){window.scrollTo(0,0);
  if(view==='list')renderList();
  else if(view==='form')renderForm(id);
  else if(view==='detail'){ui.dtab='memo';renderDetail(id)}
  else if(view==='settings')renderSettings();
}

/* 画像を端末から選んで縮小し、カバーとして保存（美術展など書影が無いとき用） */
function shrinkImage(src,maxW,quality){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxW/img.width);
      const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);
      cx.drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',quality||0.75));
    };
    img.onerror=rej;img.src=src;
  });
}
async function pickCoverFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  if(!/^image\//.test(f.type)){toast('画像ファイルを選んでください');return}
  try{
    const raw=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
    const small=await shrinkImage(raw,480,0.75);
    setCover(small);toast('カバー画像を設定しました');
  }catch(e){toast('画像を読み込めませんでした')}
  input.value='';
}

async function wikidataCreator(pageid){
  try{
    const p=await fetch(`https://ja.wikipedia.org/w/api.php?action=query&pageids=${pageid}&prop=pageprops&format=json&origin=*`).then(r=>r.json());
    const qid=p.query.pages[pageid].pageprops?.wikibase_item;if(!qid)return'';
    const e=await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qid}&props=claims&format=json&origin=*`).then(r=>r.json());
    const cl=e.entities[qid].claims;
    const pid=['P50','P57','P170','P127'].find(k=>cl[k]);if(!pid)return'';
    const cid=cl[pid][0].mainsnak.datavalue?.value?.id;if(!cid)return'';
    const l=await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${cid}&props=labels&languages=ja|en&format=json&origin=*`).then(r=>r.json());
    const lb=l.entities[cid].labels;return (lb.ja||lb.en||{}).value||'';
  }catch(e){return''}
}

/* ---- Wikipedia ---- */
function wnorm(s){return (s||'').toLowerCase()
  .replace(/[　\s・,.。、「」『』（）()＝=!！?？:：;；\-—–ー~〜]/g,'')
  .replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
  .replace(/no\.?(\d)/g,'no$1')}
function wRelevant(title,q){
  const a=wnorm(title),b=wnorm(q);
  if(!a||!b)return false;
  if(a.includes(b)||b.includes(a))return true;
  let n=0;while(n<a.length&&n<b.length&&a[n]===b[n])n++;
  return n>=Math.min(4,Math.max(3,Math.floor(b.length*0.7)));
}
async function wikiSearch(q,mode){
  const d=await fetch(`https://ja.wikipedia.org/w/api.php?action=query&list=search&srsearch=${enc(mode==='intitle'?'intitle:'+q:q)}&srlimit=5&format=json&origin=*`).then(r=>r.json());
  return d.query?.search||[];
}
function wikiBox(){return $('#wikibox')||$('#dpanel')}
async function loadWiki(it){
  const p=wikiBox();if(!p)return;
  try{
    let pageid=it.wikiPageId;
    if(!pageid){
      const q=it.wikiTitle||it.title;
      let hits=await wikiSearch(q,'intitle');
      let hit=hits.find(h=>wRelevant(h.title,q));
      if(!hit){hits=await wikiSearch(q);hit=hits.find(h=>wRelevant(h.title,q))}
      if(!hit){p.innerHTML=wikiPickerHtml(q,`「${esc(q)}」に一致するWikipedia記事は見つかりませんでした。無関係な記事を表示しないよう、確実に一致するものだけを出しています。下の欄から正しい記事を選べます。`);wikiPick();return}
      pageid=hit.pageid;
    }
    const d=await fetch(`https://ja.wikipedia.org/w/api.php?action=query&pageids=${pageid}&prop=extracts|pageimages&exintro&explaintext&piprop=thumbnail&pithumbsize=600&format=json&origin=*`).then(r=>r.json());
    const pg=d.query.pages[pageid];
    if(!pg||pg.missing!==undefined){p.innerHTML=wikiPickerHtml(it.wikiTitle||it.title,'指定されていた記事が見つかりませんでした。もう一度選び直してください。');wikiPick();return}
    p.innerHTML=`<div class="panel">
      ${pg.thumbnail?`<img class="wikiimg" src="${pg.thumbnail.source}" alt="">`:''}
      <h4>${esc(pg.title)} — Wikipedia</h4>
      <div class="memo-body" style="font-size:.88rem">${esc((pg.extract||'').slice(0,800))}${(pg.extract||'').length>800?'…':''}</div>
      <div class="linklist" style="margin-top:10px"><a href="https://ja.wikipedia.org/?curid=${pageid}" target="_blank" rel="noopener">記事全文を読む</a></div>
      <div class="btnrow" style="margin-top:14px"><button class="btn small ghost" onclick="openWikiPicker()">別の記事を選ぶ</button></div>
    </div>`;
  }catch(e){p.innerHTML=`<div class="panel"><div class="note">Wikipediaに接続できませんでした（オフラインの可能性）。</div></div>`}
}

/* ============ share / AI ============ */
/* X（旧Twitter）の公式カウント仕様に準拠
   - 文字の重み: U+0000〜U+10FF などは1、それ以外（日本語・絵文字など）は2
   - URLは実際の長さに関わらず23としてカウント（t.coに置換されるため）
   - 上限は280ユニット（日本語のみなら140文字相当） */
const X_MAX=280, X_URL=23;
function xCharWeight(cp){
  return (cp<=4351||(cp>=8192&&cp<=8205)||(cp>=8208&&cp<=8223)||(cp>=8242&&cp<=8247))?1:2;
}
function xUnits(str){
  let n=0;
  const masked=String(str||'').replace(/https?:\/\/\S+/g,'\u0001');
  for(const ch of masked){
    if(ch==='\u0001'){n+=X_URL;continue}
    n+=xCharWeight(ch.codePointAt(0));
  }
  return n;
}
function xRemaining(str){return X_MAX-xUnits(str)}
/* 本文＋末尾（リンク等）が上限に収まるよう本文だけを詰める */
function xFit(body,tail){
  const t=tail||'';
  const max=X_MAX-xUnits(t);
  const b=String(body||'');
  if(xUnits(b)<=max)return b+t;
  let out='',n=0;
  const ELL='…',ELLW=xUnits(ELL);
  const masked=b.replace(/https?:\/\/\S+/g,()=>'\u0001');
  let idx=0;const urls=b.match(/https?:\/\/\S+/g)||[];
  for(const ch of masked){
    const w=ch==='\u0001'?X_URL:xCharWeight(ch.codePointAt(0));
    if(n+w>max-ELLW)break;
    out+=ch==='\u0001'?urls[idx++]:ch;
    n+=w;
  }
  return out.replace(/\s+$/,'')+ELL+t;
}
/* 関連商品の先頭アイテム（アフィリエイトURL）を末尾に添える */

      return `\n\n---\n\n▼ この作品\n[${p.title}${price}](${p.url})\n\n※ 商品リンクにはアフィリエイトを含みます。`;
    }

  }catch(e){return ''}
}

async function wikiExtractFor(it){
  try{
    let pid=it.wikiPageId;
    if(!pid){
      const q=it.wikiTitle||it.title;
      let hits=await wikiSearch(q,'intitle');
      let h=hits.find(x=>wRelevant(x.title,q));
      if(!h){hits=await wikiSearch(q);h=hits.find(x=>wRelevant(x.title,q))}
      pid=h&&h.pageid;
    }
    if(!pid)return '';
    const d=await fetch(`https://ja.wikipedia.org/w/api.php?action=query&pageids=${pid}&prop=extracts&exintro&explaintext&format=json&origin=*`).then(r=>r.json());
    return (d.query.pages[pid].extract||'').slice(0,700);
  }catch(e){return ''}
}
async function aiContext(it){
  const ctx={};
  const jobs=[];
  jobs.push(wikiExtractFor(it).then(w=>{if(w)ctx.wiki=w}));
  if(rkKey())jobs.push(rkFetch(it.type,it.title,30).then(d=>{
    const top=(d.Items||[]).map(i=>rkNorm(it.type,i)).filter(p=>+p.revc>0).sort((a,b)=>(+b.revc)-(+a.revc))[0];
    if(top)ctx.rakuten={rating:+(+top.rev).toFixed(2),count:+top.revc};
  }).catch(()=>{}));
  const urls=[...(it.xPosts||[]),...(it.notePosts||[])].slice(0,3);
  if(urls.length)jobs.push(Promise.all(urls.map(u=>
    fetch(API_BASE+'/api/oembed?url='+enc(u)).then(r=>r.ok?r.json():null).catch(()=>null)
  )).then(list=>{
    const vs=list.filter(v=>v&&v.text).map(v=>v.text);
    if(vs.length)ctx.voices=vs;
  }).catch(()=>{}));
  await Promise.all(jobs);
  return ctx;
}
async function aiFormat(it,mode){
  const ctx=mode==='note'?await aiContext(it):{};
  const r=await fetch(API_BASE+'/api/ai',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({mode,type:TYPES[it.type].label,title:it.title,creator:it.creator,rating:it.rating,quotes:it.quotes,memo:it.memo,
      wiki:ctx.wiki||'',rakuten:ctx.rakuten||null,voices:ctx.voices||[],reserveLink:!!rkKey()})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.text){if(r.status===503)siteCfg.ai=false;throw new Error(j.error||'ai')}
  return j.text;
}

function exportJson(){
  const blob=new Blob([JSON.stringify({items,exportedAt:new Date().toISOString()},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`myshelf-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
}
function importJson(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const d=JSON.parse(rd.result);const arr=Array.isArray(d)?d:d.items;
    if(!Array.isArray(arr))throw 0;
    const ids=new Set(items.map(x=>x.id));
    arr.forEach(x=>{if(x.id&&!ids.has(x.id))items.push(x)});
    saveItems();toast(`インポート完了（現在${items.length}件）`);renderSettings();
  }catch(e){toast('読み込めないファイルです')}};
  rd.readAsText(f);
}

/* ============ 公開リンク（サーバー不要・データはURLに内包） ============ */
function b64url(bytes){let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64url(str){const b=atob(str.replace(/-/g,'+').replace(/_/g,'/'));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function packData(obj){
  const json=JSON.stringify(obj);
  if(typeof CompressionStream==='undefined')return 'r'+b64url(new TextEncoder().encode(json));
  const stream=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return 'z'+b64url(new Uint8Array(await new Response(stream).arrayBuffer()));
}
async function unpackData(str){
  const kind=str[0],bytes=unb64url(str.slice(1));
  if(kind==='r')return JSON.parse(new TextDecoder().decode(bytes));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(stream).text());
}
function slimItem(it,product){
  const o={y:it.type,t:it.title};
  if(it.creator)o.c=it.creator;
  if(it.date)o.d=it.date;
  if(it.rating)o.r=it.rating;
  if((it.tags||[]).length)o.g=it.tags;
  if(it.memo)o.m=it.memo;
  if(it.quotes)o.q=it.quotes;
  if(it.cover)o.v=it.cover;
  if((it.myPosts||[]).length)o.s=it.myPosts;
  if(product)o.p=product;
  return o;
}
async function topProduct(it){
  if(!rkKey())return null;
  try{
    const d=await rkFetch(it.type,it.title,1);
    const p=(d.Items||[]).map(i=>rkNorm(it.type,i)).filter(x=>x.title&&x.url)[0];
    return p?{t:p.title,p:p.price||'',u:p.url,i:p.img||''}:null;
  }catch(e){return null}
}

      <div class="note" style="margin-top:14px">記録の内容はリンクそのものに埋め込まれます。サーバーには保存されず、<b>リンクを知っている人だけ</b>が見られます。検索結果にも出ません。<br><br>公開した内容の責任は公開したご本人にあります。運営者は内容について責任を負いません。</div>
      <div id="publink" style="margin-top:16px"></div>

        <button class="btn primary" onclick="makePublicLink()">リンクを作る</button>
        <button class="btn ghost" onclick="closeModal()">閉じる</button>
      </div>
    </div></div>`;
}
async function makePublicLink(){
  const box=$('#publink');if(!box)return;
  box.innerHTML='<div class="spin">リンクを作成中…</div>';
  const name=($('#pubname')||{}).value?.trim()||'';
  lsSet('kansou_pubname',name);
  try{
    let list;
    if(pubDraft.mode==='one'){
      const it=items.find(x=>x.id===pubDraft.id);
      if(!it)throw new Error('no item');
      const one=slimItem(it,await topProduct(it));
      if(one.v&&one.v.startsWith('data:')){try{one.v=await shrinkImage(one.v,240,0.6)}catch(e){delete one.v}}
      list=[one];
    }else{
      const src=items.slice(0,30);
      list=await Promise.all(src.map(async it=>{
        const o=slimItem(it,null);
        if(o.v&&o.v.startsWith('data:')){
          if(src.length<=5){try{o.v=await shrinkImage(o.v,200,0.55)}catch(e){delete o.v}}
          else delete o.v;
        }
        return o;
      }));
    }
    const payload={v:1,n:name,i:list};
    const packed=await packData(payload);
    const url=shareUrl()+'#s='+packed;
    window._pubUrl=url;
    const long=url.length>7000;
    box.innerHTML=`
      <div class="note" style="word-break:break-all;border:1px solid var(--line);border-radius:3px;padding:10px;background:var(--card);max-height:120px;overflow:auto">${esc(url)}</div>
      <div class="btnrow" style="margin-top:12px;flex-wrap:wrap;row-gap:10px">
        <button class="btn small accent" onclick="copyPublicLink()">リンクをコピー</button>
        <button class="btn small ghost" onclick="sharePublicX()">𝕏 でシェア</button>
        <button class="btn small ghost" onclick="open(window._pubUrl,'_blank')">開いて確認</button>
      </div>
      ${long?'<div class="note" style="color:var(--danger)">リンクが長いため、一部のアプリで途中で切れることがあります。公開する件数を減らすか、1件ずつの公開をおすすめします。</div>':''}`;
  }catch(e){box.innerHTML='<div class="note">リンクを作成できませんでした。</div>'}
}
async function copyPublicLink(){
  try{await navigator.clipboard.writeText(window._pubUrl);toast('リンクをコピーしました')}
  catch(e){toast('コピーできませんでした')}
}

function pubCard(o,i){
  const type=TYPES[o.y]?o.y:'book';
  const posts=(o.s||[]).map((u,j)=>myPubEmbed(u)).join('');
  const p=o.p;
  return `<div class="panel pubcard">
    <div class="dhead" style="margin-bottom:4px">
      ${o.v?`<img class="dcover" src="${esc(o.v)}" alt="">`:''}
      <div style="flex:1;min-width:0">
        <div class="meta"><span class="tico">${icon(type,14)}</span>${TYPES[type].label}　${fmtDate(o.d||'')}</div>
        <h2>${esc(o.t)}</h2>
        <div class="creator">${esc(o.c||'')}</div>
        <div class="stars" style="font-size:.95rem;margin-top:5px">${stars(o.r||0)}</div>
      </div>
    </div>
    ${o.q?`<h4 style="margin-top:16px">印象に残ったフレーズ</h4><div class="quote">${esc(o.q)}</div>`:''}
    ${o.m?`<h4>感想</h4><div class="memo-body">${esc(o.m)}</div>`:''}
    ${(o.g||[]).map(t=>`<span class="tagchip">${esc(t)}</span>`).join('')}
    ${posts?`<hr class="sep">${posts}`:''}
    ${p?`<hr class="sep"><a class="prod" href="${esc(p.u)}" target="_blank" rel="noopener">
        ${p.i?`<img src="${esc(bigImg(p.i))}" loading="lazy" alt="">`:'<div style="width:52px"></div>'}
        <div style="flex:1;min-width:0"><div class="pt">${esc(p.t)}</div>
        <div class="pp">${p.p?(+p.p).toLocaleString()+'円':''}</div></div></a>
      <div class="note">※ 商品リンクにはアフィリエイトを含みます。</div>`:''}
  </div>`;
}
function myPubEmbed(url){
  if(xValid(url))return `<blockquote class="twitter-tweet" data-lang="ja" data-dnt="true"><a href="${esc(url)}"></a></blockquote>`;
  const id=noteId(url);
  return id?`<iframe class="note-embed" src="https://note.com/embed/notes/${id}" height="400" loading="lazy" title="note記事"></iframe>`:'';
}
/* ============ init ============ */
if(location.hash.startsWith('#s=')){bootViewer(location.hash.slice(3))}else{renderList()}
addEventListener('hashchange',()=>{
  if(location.hash.startsWith('#s='))bootViewer(location.hash.slice(3));
  else if(document.body.classList.contains('viewing'))location.reload();
});
(async function loadCfg(){
  for(const base of [API_BASE,'']){
    try{
      const r=await fetch(base+'/api/config');
      if(!r.ok)continue;
      const c=await r.json();
      API_BASE=base;siteCfg=Object.assign(siteCfg,c||{});
      if(c&&c.rakuten===false)rkState='unconfigured';
      return;
    }catch(e){}
  }
  rkState='unconfigured';
})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
